# One Postgres pod on an emptyDir. Trust auth: the cluster is local and
# short-lived, and no password goes into the repo.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: agent-gate-e2e
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: POSTGRES_IMAGE
          env:
            - name: POSTGRES_HOST_AUTH_METHOD
              value: trust
            - name: POSTGRES_DB
              value: agent_gate
          ports:
            - containerPort: 5432
          readinessProbe:
            exec:
              command: [pg_isready, -U, postgres, -d, agent_gate]
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: agent-gate-e2e
spec:
  selector:
    app: postgres
  ports:
    - name: postgres
      port: 5432
