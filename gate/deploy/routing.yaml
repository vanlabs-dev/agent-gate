apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayBackend
metadata:
  name: stub-mcp
  namespace: agent-gate-e2e
spec:
  mcp:
    targets:
      - name: stub-mcp
        static:
          host: stub-mcp.agent-gate-e2e.svc.cluster.local
          port: 8080
          protocol: StreamableHTTP
---
# /mcp needs a Dex token. /mcp-noauth has no JWT policy, so its calls reach
# the gate with no identity claims.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: mcp
  namespace: agent-gate-e2e
spec:
  parentRefs:
    - name: gateway
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /mcp
      backendRefs:
        - name: stub-mcp
          group: agentgateway.dev
          kind: AgentgatewayBackend
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: mcp-noauth
  namespace: agent-gate-e2e
spec:
  parentRefs:
    - name: gateway
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /mcp-noauth
      backendRefs:
        - name: stub-mcp
          group: agentgateway.dev
          kind: AgentgatewayBackend
---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: jwt
  namespace: agent-gate-e2e
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: mcp
  traffic:
    jwtAuthentication:
      mode: Strict
      providers:
        - issuer: http://dex.agent-gate-e2e.svc.cluster.local:5556/dex
          audiences: [agent-gate]
          jwks:
            remote:
              jwksPath: dex/keys
              backendRef:
                group: ""
                kind: Service
                name: dex
                port: 5556
---
# Each tools/call goes to the gate before and after the upstream call. The
# metadata keys are what the gate reads: the gate config names a key, not a
# token claim. A gate configured with the caller claim oid needs `oid: jwt.oid`.
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: gate
  namespace: agent-gate-e2e
spec:
  targetRefs:
    - group: agentgateway.dev
      kind: AgentgatewayBackend
      name: stub-mcp
  backend:
    mcp:
      guardrails:
        processors:
          - remote:
              backendRef:
                name: agent-gate
                port: 9001
              failureMode: FailClosed
              metadata:
                sub: jwt.sub
              allowedRequestHeaders:
                - mcp-protocol-version
            methods:
              tools/call: Full
---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: gate-timeout
  namespace: agent-gate-e2e
spec:
  targetRefs:
    - group: ""
      kind: Service
      name: agent-gate
  backend:
    http:
      requestTimeout: 5s
