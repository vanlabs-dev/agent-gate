[project]
name = "azure-ops"
version = "0.1.0"
description = "The Azure operations agent that agent-gate protects. Scaffold only, no agent logic yet."
authors = [
    { name = "vanlabs-dev", email = "vanlabs@pm.me" }
]
requires-python = ">=3.14"
dependencies = []

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
required-version = "==0.12.5"
python-preference = "only-managed"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]
