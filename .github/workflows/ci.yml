name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# The job names are the check names that the ruleset in .github/rulesets/main.json requires.
jobs:
  go:
    name: go
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: test/extmcp/go.mod
          cache-dependency-path: |
            versions.env
            test/extmcp/go.sum
      - run: make lint-go
      - if: ${{ !cancelled() }}
        run: make test-go

  python:
    name: python
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          working-directory: agents/azure-ops
      - run: uv --version
      - run: make lint-python
      - if: ${{ !cancelled() }}
        run: make test-python

  govulncheck:
    name: govulncheck
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: test/extmcp/go.mod
          cache-dependency-path: |
            versions.env
            test/extmcp/go.sum
      - run: make vuln

  secrets:
    name: secrets
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: test/extmcp/go.mod
          cache-dependency-path: |
            versions.env
            test/extmcp/go.sum
      - run: make secrets

  actionlint:
    name: actionlint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: test/extmcp/go.mod
          cache-dependency-path: |
            versions.env
            test/extmcp/go.sum
      - run: make lint-actions
