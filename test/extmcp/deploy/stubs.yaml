# Stub MCP server: the upstream that the gateway routes to.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stub-mcp
  namespace: agent-gate-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: stub-mcp
  template:
    metadata:
      labels:
        app: stub-mcp
    spec:
      containers:
        - name: stub-mcp
          image: agent-gate/extmcp-stubs:dev
          imagePullPolicy: Never
          command: ["/stub-mcp"]
          ports:
            - containerPort: 8080
          readinessProbe:
            tcpSocket:
              port: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: stub-mcp
  namespace: agent-gate-test
spec:
  selector:
    app: stub-mcp
  ports:
    - name: http
      port: 8080
---
# Stub gate: the ExtMcp server (9001) and its test-only HTTP endpoints (8081).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stub-gate
  namespace: agent-gate-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: stub-gate
  template:
    metadata:
      labels:
        app: stub-gate
    spec:
      containers:
        - name: stub-gate
          image: agent-gate/extmcp-stubs:dev
          imagePullPolicy: Never
          command: ["/stub-gate"]
          ports:
            - containerPort: 9001
            - containerPort: 8081
          readinessProbe:
            tcpSocket:
              port: 9001
---
apiVersion: v1
kind: Service
metadata:
  name: stub-gate
  namespace: agent-gate-test
spec:
  selector:
    app: stub-gate
  ports:
    - name: grpc
      port: 9001
      appProtocol: kubernetes.io/h2c
    - name: http
      port: 8081
